<!DOCTYPE html>  
<html>  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>FIFA WORLD CUP 2026</title>     
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">  
  <style>  
   * { margin: 0; padding: 0; box-sizing: border-box; }  
      html, body {  
        background: #000;  
        height: 100vh;  
        width: 100vw;  
        overflow: hidden;  
        font-family: system-ui, -apple-system, sans-serif;  
      }  
      .shaka-video-container {  
        position: absolute;  
        inset: 0;  
        width: 100%;  
        height: 100%;  
      }  
      video {  
        width: 100%;  
        height: 100%;  
        background: #000;  
        object-fit: contain;  
      }  
      .shaka-spinner-container,  
      .shaka-spinner,  
      .shaka-spinner-svg {  
        display: none !important;  
        visibility: hidden !important;  
        opacity: 0 !important;  
      }  
    </style>  
</head> 

   
    
  <body>  
  <div class="shaka-video-container" data-shaka-player>  
    <video autoplay playsinline preload="metadata" poster="https://w0.peakpx.com/wallpaper/183/933/HD-wallpaper-fifa-world-cup-26-u-sports-soccer-mexico-canada-football-fifa-world-cup-world-cup-2018-soccer-2018-4k-wallpaper-preview.jpg"></video>  
  </div>  
    
  <script>  
    document.addEventListener('DOMContentLoaded', async () => {  
      // Block any unexpected external navigation/popups from touch/click interactions.
      const blockExternalAds = () => {
        const originalOpen = window.open;
        window.open = function () {
          console.warn('Blocked popup request');
          return null;
        };

        document.addEventListener('contextmenu', (event) => {
          event.preventDefault();
        }, { passive: false });

        document.addEventListener('click', (event) => {
          const anchor = event.target.closest && event.target.closest('a');
          if (anchor) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        document.addEventListener('touchstart', (event) => {
          const target = event.target;
          if (target && target.closest && target.closest('a')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, { passive: false });

        document.addEventListener('touchend', (event) => {
          const target = event.target;
          if (target && target.closest && target.closest('a')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, { passive: false });

        window.addEventListener('beforeunload', (event) => {
          event.preventDefault();
        });
      };

      blockExternalAds();

      shaka.polyfill.installAll();  
    
      if (!shaka.Player.isBrowserSupported()) {  
        console.error('Browser not supported');  
        return;  
      }  
    
      const video = document.querySelector('video');  
      const player = new shaka.Player();  
      await player.attach(video);  
    
      const container = document.querySelector('.shaka-video-container');  
      const ui = new shaka.ui.Overlay(player, container, video);  
    
      ui.configure({  
        controlPanelElements: [  
          'play_pause', 'time_and_duration', 'mute', 'volume',  
          'spacer', 'language', 'captions', 'picture_in_picture',  
          'quality', 'fullscreen'  
        ],  
        volumeBarColors: {  
    base: 'rgba(0, 136, 255, 0.3)',  
    level: 'rgb(0, 136, 255)'  
  },  
  seekBarColors: {
    base: 'rgba(90, 0, 0, 0.3)',
    buffered: 'rgba(120, 0, 0, 0.6)',
    played: 'rgb(170, 0, 0)'
  }
      });  
    
     
      let drmConfig = {  
        clearKeys: {  
          "8c80205dcd2490ef9386a322c46aef12":
  "0dba6b2d52b76e5dff92fac577e7ac8d"  
        }  
      };  
    
      let streamUrl = "https://otte.live.fly.ww.aiv-cdn.net/iad-nitro/live/clients/dash/enc/ntomodyqm3/out/v1/cd61ecc8b6694006a1173974fcfa4e9e/cenc.mpd?";  
    
      player.configure({  
        drm: drmConfig,  
        streaming: {  
          lowLatencyMode: true,  
          bufferingGoal: 15,  
          rebufferingGoal: 2,  
          bufferBehind: 15,  
          retryParameters: {  
            timeout: 10000,  
            maxAttempts: 5,  
            baseDelay: 300,  
            backoffFactor: 1.2  
          },  
          segmentRequestTimeout: 8000,  
          segmentPrefetchLimit: 2,  
          useNativeHlsOnSafari: true  
        },  
        manifest: {  
          retryParameters: {  
            timeout: 8000,  
            maxAttempts: 3  
          }  
        }  
      });  
    
      player.addEventListener('error', (event) => {  
        console.error('Shaka Player Error:', event.detail);  
      });  
    
      try {  
        await player.load(streamUrl);  
        console.log("Stream loaded successfully");  
      } catch (error) {  
        console.error('Load error:', error);  
      }  
    });  
  </script>  
  </body>  
  </html>
